<style>
    @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap');

    body {
        font-family: 'Quicksand', 'Heebo', sans-serif;
        background-color: #f8fafc;
        overflow: hidden;
        height: 100vh;
        margin: 0;
        overscroll-behavior: none;
    }
    #root {
        height: 100%;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-5px); }
    }
    .animate-shake { animation: shake 0.4s ease-in-out; }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.4); opacity: 0.8; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop { animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

    @keyframes select-pulse {
      0%, 100% { 
        box-shadow: 0 0 0 0px rgba(59, 130, 246, 0.6); 
        border-color: #2563eb;
        background-color: #eff6ff;
      }
      50% { 
        box-shadow: 0 0 0 6px rgba(59, 130, 246, 0.4); 
        border-color: #3b82f6;
        background-color: #dbeafe;
      }
    }
    .animate-select-pulse { animation: select-pulse 1.2s infinite ease-in-out; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
    }
    .animate-float { animation: float 4s ease-in-out infinite; }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .shimmer {
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      background-size: 200% 100%;
      animation: shimmer 2s infinite;
    }

    .text-gradient {
      background: linear-gradient(135deg, #2563eb 0%, #06b6d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    @keyframes fall {
        0% { transform: translateY(-20vh) rotate(0deg) translateX(0); opacity: 1; }
        100% { transform: translateY(110vh) rotate(720deg) translateX(20px); opacity: 0; }
    }

    @keyframes dance {
      0%, 100% { transform: translateY(0) rotate(0); }
      25% { transform: translateY(-12px) rotate(-5deg); }
      50% { transform: translateY(0) rotate(0deg); }
      75% { transform: translateY(-12px) rotate(5deg); }
    }
    .animate-dance { animation: dance 0.6s ease-in-out infinite; }

    @keyframes claim-pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); filter: brightness(1.2) saturate(1.2); border-color: #fbbf24; }
      100% { transform: scale(1); }
    }
    .animate-claim-pop { animation: claim-pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

    @keyframes float-hint {
      0% { transform: translateY(0); opacity: 0; }
      20% { transform: translateY(-10px); opacity: 1; }
      100% { transform: translateY(-40px); opacity: 0; }
    }
    .animate-float-hint { animation: float-hint 1s ease-out forwards; }
</style>
